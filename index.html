<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4efe5">
  <title>Полоса препятствий для первого экрана · Дейтерагогика</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <div class="wordmark"><img class="mark" src="assets/mark.svg" alt="" width="34" height="34"> <span data-brand>Практикум первого экрана</span></div>
    <span class="course" data-course>Дизайн интерфейсов</span>
    <span id="copy-status" role="status"></span>
    <button type="button" id="copy-personal" class="quiet" hidden><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg><span>Скопировать личную ссылку</span></button>
    <button id="exit" class="quiet" hidden>Выйти</button>
  </header>
  <main id="app"><p role="status">Открываем практикум…</p></main>
  <footer>
    <a href="/example/">Учебный пример · Полутень</a>
    <a data-lecture>Лекция: желание и адресат</a>
    <span data-groups></span>
  </footer>
  <template id="intro">
    <section class="cover">
      <div class="lead">
        <p class="eyebrow">Практикум</p>
        <h1>Полоса препятствий<br>для первого экрана<span>.</span></h1>
        <p>Вы проведёте один экран через 12 испытаний. Одногруппники расскажут, что увидели, а вы решите, что изменить. <a href="/example/">Посмотрите, как менялась «Полутень»</a>, или <a href="#entry">войдите в практикум</a>.</p>
      </div>
      <figure>
        <img src="assets/cover.jpg" alt="Учебный эскиз: тень на одно место скамьи">
        <figcaption>Тень на одного / Учебный пример</figcaption>
      </figure>
    </section>
  </template>
  <template id="guide">
    <div class="guide-body">
      <section>
        <h3>Начните со своего экрана</h3>
        <p>Посмотрите, <a href="/example/">как менялась «Полутень» за 12 испытаний</a>. На каждом этапе можно сравнить эскизы до и после правки и прочитать ответ, который повлиял на решение автора.</p>
        <p>Выберите группу и своё имя. После входа нажмите «Скопировать личную ссылку» вверху страницы и сохраните адрес, чтобы вернуться к своему экрану с другого устройства.</p>
        <p>Во вкладке «Мой экран» загрузите JPG или PNG до 5 МБ. Оставьте в кадре только ту часть лендинга, которую посетитель увидит до прокрутки.</p>
        <p>Откройте «Маршрут · 12 этапов». Запишите, что хотите выяснить о своём экране, и нажмите «Открыть этап для групп».</p>
      </section>
      <section>
        <h3>Проверьте чужой эскиз</h3>
        <p>Во вкладке «Экраны групп» нажмите «Пройти этап» рядом с заданием, которое открыл автор. Для отдельной пятисекундной проверки нажмите на плитку эскиза в галерее. Начать можно ещё до загрузки своего экрана. Ответьте на готовые вопросы своими словами и сохраните ответы. Автор увидит их вместе с вашим именем.</p>
        <p>На этапах с таймером нажмите «Начать показ» и оставайтесь во вкладке. Через пять секунд эскиз исчезнет. Напишите, что запомнили. В свободной проверке вы проходите версии каждого автора по порядку. После сохранения ответов откроется следующая доступная версия. В каждой проверке три вопроса — о предложении, его адресате и том, чего вы ждёте от кнопки.</p>
      </section>
      <section>
        <h3>Решите, что взять в следующий этап</h3>
        <p>Вернитесь к своему этапу и нажмите «Обновить ответы». Что человек понял иначе, чем вы ожидали? Выберите кадр для следующего испытания и запишите решение. В обосновании укажите деталь эскиза или реплику, которая повлияла на ваш выбор.</p>
        <p>Исходные кадры, ответы одногруппников и все ваши решения собраны во вкладке «Мой экран» → «Вся история по этапам».</p>
      </section>
      <section>
        <h3>Как считаются баллы</h3>
        <p data-score-rules>Каждый сохранённый ответ на вопрос о чужом эскизе — <strong>1 балл</strong>. Новая версия своего экрана — <strong>2 балла</strong>, с обоснованием — <strong>3 балла за всю правку</strong>. Если решите оставить прежний кадр, объясните почему — за это тоже <strong>3 балла</strong>. Исходный экран и преподавательская самопроверка дают 0 баллов. При перезапуске маршрута баллы за свой экран в прежней попытке снимаются, а баллы за ответы по чужим эскизам сохраняются.</p>
        <p>Во вкладке «Рейтинг» видно, сколько баллов вы получили за свои правки и сколько — за ответы одногруппникам.</p>
      </section>
    </div>
  </template>
</body>
</html>
